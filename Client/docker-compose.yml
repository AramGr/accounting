version: "3.9"

services:
  php:
    build:
      context: ./docker/php
    container_name: client-test-php
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  nginx:
    image: nginx:stable
    container_name: client-test-nginx
    ports:
      - "8090:80"
    volumes:
      - ./app/public:/var/www/html/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mysql:8.4
    container_name: client-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: client
      MYSQL_USER: admin
      MYSQL_PASSWORD: adminClientPass
    ports:
      - "3309:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
